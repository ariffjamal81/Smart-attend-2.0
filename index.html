<!DOCTYPE html>
<html>
<head>
    <title>Smart Attend 2.0 - Face Sync</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #webcam-container { margin: 20px auto; border: 5px solid #333; width: 400px; }
        .controls { background: #f4f4f4; padding: 15px; border-radius: 10px; display: inline-block; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <h1>Smart Attend Saujana (Sync Mode)</h1>
    
    <div class="controls">
        <p>1. Masukkan IP ESP32 (dari Serial Monitor):</p>
        <input type="text" id="espIp" value="172.20.10.4" placeholder="Contoh: 172.20.10.4">
        <br><br>
        <button type="button" onclick="init()">2. Start Camera</button>
    </div>

    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script type="text/javascript">
        // --- MASUKKAN URL MODEL TEACHABLE MACHINE ANDA ---
        const URL = "https://teachablemachine.withgoogle.com/models/siii58vzR/"; 

        let model, webcam, labelContainer, maxPredictions;
        let lastSentName = "";
        let lastSentTime = 0;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(400, 400, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            // Cari kelas dengan probability tertinggi
            let best = { name: "", prob: 0 };
            for (let i = 0; i < maxPredictions; i++) {
                const pName = prediction[i].className;
                const pProb = prediction[i].probability;
                labelContainer.childNodes[i].innerHTML = pName + ": " + pProb.toFixed(2);
                
                if (pProb > best.prob) {
                    best = { name: pName, prob: pProb };
                }
            }

            // Logik Sync: Prob > 90%, Bukan 'Class 1', Dan bertenang selama 10 saat
            const ip = document.getElementById("espIp").value;
            const cooldown = Date.now() - lastSentTime > 10000;

            if (best.prob > 0.90 && best.name !== "Class 1" && cooldown) {
                lastSentTime = Date.now();
                sendToESP32(ip, best.name);
            }
        }

        function sendToESP32(ip, name) {
            console.log("Hantar " + name + " ke ESP32...");
            
            // Guna fetch untuk trigger ESP32 baca suhu & hantar ke Google
            fetch(http://${ip}/update?name=${encodeURIComponent(name)})
                .then(response => response.text())
                .then(data => alert("Berjaya! Data " + name + " dihantar."))
                .catch(err => console.error("Gagal hubungi ESP32. Semak IP atau Hotspot."));
        }
    </script>
</body>
</html>
