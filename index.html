<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Smart Attend Saujana 2.0 - AI + Sensor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        #webcam-container { margin: 20px auto; border: 10px solid #333; border-radius: 15px; width: max-content; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .status-box { background: white; padding: 20px; border-radius: 10px; display: inline-block; min-width: 300px; margin-top: 10px; }
        #label-container { font-size: 24px; font-weight: bold; color: #007bff; }
        #temp-display { font-size: 20px; color: #dc3545; margin-top: 10px; }
        .btn { padding: 15px 40px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>Smart Attend Saujana 2.0</h2>
    <button class="btn" onclick="init()">MULAKAN SISTEM</button>

    <div id="webcam-container"></div>
    
    <div class="status-box">
        <div id="label-container">Sila mulakan kamera</div>
        <div id="temp-display">Suhu Sensor: -- °C</div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const URL_MODEL = "https://teachablemachine.withgoogle.com/models/siii58vzR/"; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYZzHEJISGj_WQB43wlhxx5aWF0JAIFVdiUJRT1EhxqFm8KNjvOA9oIXeTcF8xKpsCXw/exec"; 
        const IP_ESP32 = "http://172.20.10.4/temp"; // Pastikan path /temp ada dalam kod ESP
        // -------------------

        let model, webcam, labelContainer, tempDisplay, maxPredictions;
        let isProcessing = false;
        let currentSuhu = "0.0";

        // Fungsi ambil suhu dari ESP32 setiap 2 saat
        async function getTemperature() {
            try {
                const response = await fetch(IP_ESP32);
                const data = await response.text();
                currentSuhu = data;
                document.getElementById("temp-display").innerHTML = "Suhu Sensor: " + data + " °C";
            } catch (err) {
                console.log("Gagal akses ESP32");
            }
        }
        setInterval(getTemperature, 2000);

        async function init() {
            document.getElementById("label-container").innerHTML = "Memuatkan AI...";
            model = await tmImage.load(URL_MODEL + "model.json", URL_MODEL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            webcam = new tmImage.Webcam(400, 400, true);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            document.getElementById("label-container").innerHTML = "Sedia untuk Scan";
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const prob = prediction[i].probability;
                const name = prediction[i].className;

                // Papar nama & peratusan live
                if (prob > 0.15) {
                    document.getElementById("label-container").innerHTML = name + " (" + (prob * 100).toFixed(0) + "%)";
                }

                // Jika yakin > 90%
                if (prob > 0.90 && name !== "Class 2" && !isProcessing) {
                    isProcessing = true;
                    const confidence = (prob * 100).toFixed(0) + "%";
                    hantarData(name, currentSuhu, confidence);
                }
            }
        }

        function hantarData(nama, suhu, peratus) {
            document.getElementById("label-container").innerHTML = "Merekod: " + nama;
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    name: nama,
                    temperature: suhu,
                    status: "Hadir (" + peratus + ")"
                })
            }).then(() => {
                console.log("Berjaya!");
                setTimeout(() => { isProcessing = false; }, 8000);
            });
        }
    </script>
</body>
</html>
