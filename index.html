<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Attend 2.0</title>
<link rel="manifest" href="./manifest.json">
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f2f4f8;
      text-align: center;
    }

    .header {
      background: #1e3a8a;
      color: white;
      padding: 15px;
    }

    .logo {
      width: 80px;
      margin-top: 10px;
      border-radius: 10px;
    }

    .card {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 15px;
    }

    button {
      padding: 12px;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 10px;
      font-size: 16px;
    }

    #webcam-container canvas {
      width: 100%;
      border-radius: 10px;
    }

    .result {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="header">
  <h2>Smart Attend 2.0</h2>

  <img class="logo"
  src="https://upload.wikimedia.org/wikipedia/ms/3/38/Sekolah_Menengah_Kebangsaan_Saujana_Impian.jpg">
</div>

<div class="card">
  <button onclick="init()">Start Camera</button>

  <div id="webcam-container"></div>

  <div class="result" id="label-container">Ready</div>
</div>

<!-- TensorFlow + Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://unpkg.com/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/siii58vzR/";

/* 🔥 PASTE WEB APP LINK KAU SINI */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwxQ1b90Xbwm7XWwJeI1DQXQd4OnvtJV61T154b28cSDLvHfdeT6qoeXSqtxTAmzZ4-bg/exec";

let model, webcam, labelContainer, maxPredictions;

async function init() {
  model = await tmImage.load(URL + "model.json", URL + "metadata.json");

  webcam = new tmImage.Webcam(250, 250, true);
  await webcam.setup();
  await webcam.play();

  document.getElementById("webcam-container").appendChild(webcam.canvas);

  labelContainer = document.getElementById("label-container");

  window.requestAnimationFrame(loop);
}

async function loop() {
  webcam.update();
  await predict();
  window.requestAnimationFrame(loop);
}

let lastSent = "";

async function predict() {
  let prediction = await model.predict(webcam.canvas);

  let best = prediction[0];

  for (let i = 0; i < prediction.length; i++) {
    if (prediction[i].probability > best.probability) {
      best = prediction[i];
    }
  }

  labelContainer.innerHTML =
    "👤 " + best.className +
    "<br>📊 " + best.probability.toFixed(2);

  if (best.probability > 0.85 && lastSent !== best.className) {
    lastSent = best.className;

    fetch(SHEET_URL, {
      method: "POST",
      body: JSON.stringify({
        name: best.className,
        status: "Present",
        confidence: best.probability.toFixed(2)
      })
    });
  }
}

</script>

</body>
</html>
