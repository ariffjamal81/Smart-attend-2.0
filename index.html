<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attend Saujana 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        h2 { color: #333; }
        #webcam-container { margin: 20px auto; border: 8px solid #333; border-radius: 10px; width: max-content; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        #label-container { font-size: 28px; font-weight: bold; color: #007bff; margin-top: 15px; height: 40px; }
        .btn { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>Smart Attend Saujana 2.0</h2>
    <p>Sistem Kehadiran Automatik Berasaskan AI</p>
    
    <button class="btn" type="button" onclick="init()">MULAKAN KAMERA</button>

    <div id="webcam-container"></div>
    <div id="label-container">Sila tekan butang untuk mula</div>

    <script type="text/javascript">
        // --- KONFIGURASI ---
        const URL_MODEL = "https://teachablemachine.withgoogle.com/models/siii58vzR/"; 
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwYZzHEJISGj_WQB43wlhxx5aWF0JAIFVdiUJRT1EhxqFm8KNjvOA9oIXeTcF8xKpsCXw/exec"; 
        // -------------------

        let model, webcam, labelContainer, maxPredictions;
        let isProcessing = false;

        async function init() {
            const labelDiv = document.getElementById("label-container");
            labelDiv.innerHTML = "Memuatkan model...";

            const modelURL = URL_MODEL + "model.json";
            const metadataURL = URL_MODEL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const flip = true; 
                webcam = new tmImage.Webcam(400, 400, flip); 
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelDiv.innerHTML = "Sedia untuk scan";
            } catch (e) {
                labelDiv.innerHTML = "Ralat: Pastikan link model betul!";
                console.error(e);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            for (let i = 0; i < maxPredictions; i++) {
                const probability = prediction[i].probability.toFixed(2);
                const name = prediction[i].className;

                // Jika AI yakin 90% dan bukan "Background/Class 2"
                if (probability > 0.90 && name !== "Class 2" && !isProcessing) { 
                    document.getElementById("label-container").innerHTML = "Dikesan: " + name;
                    sendDataToSheets(name);
                }
            }
        }

        function sendDataToSheets(detectedName) {
            isProcessing = true; 
            
            console.log("Menghantar data untuk: " + detectedName);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    name: detectedName,      // 'name' mesti sama dengan dalam GS
                    temperature: "36.5",    // Nilai suhu
                    status: "Hadir"
                })
            })
            .then(() => {
                console.log("Berjaya hantar ke Google Sheets!");
                // Tunggu 8 saat supaya tidak rekod orang yang sama berkali-kali
                setTimeout(() => { 
                    isProcessing = false; 
                    document.getElementById("label-container").innerHTML = "Sedia untuk scan seterusnya";
                }, 8000); 
            })
            .catch((error) => {
                console.error('Ralat penghantaran:', error);
                isProcessing = false;
            });
        }
    </script>
</body>
</html>
