<!DOCTYPE html>
<html>
<head>
    <title>Smart Attend 2.0 - Face Sync</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f0f2f5; }
        #webcam-container { margin: 20px auto; border: 5px solid #333; width: 400px; height: 400px; background: #ddd; border-radius: 10px; overflow: hidden; }
        .controls { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #label-container { margin-top: 20px; font-size: 18px; font-weight: bold; }
        button { padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        input { padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 200px; text-align: center; }
    </style>
</head>
<body>
    <h1>Smart Attend Saujana (Sync Mode)</h1>
    
    <div class="controls">
        <p>1. Masukkan IP ESP32 (dari Serial Monitor):</p>
        <input type="text" id="espIp" value="172.20.10.4">
        <br><br>
        <button type="button" id="startBtn" onclick="init()">2. Start Camera</button>
    </div>

    <div id="webcam-container"></div>
    <div id="label-container">Ready</div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // PENTING: Gantikan URL di bawah dengan URL Teachable Machine anak anda yang betul
        const URL_MODEL = "https://teachablemachine.withgoogle.com/models/siii58vzR/"; 

        let model, webcam, labelContainer, maxPredictions;
        let lastSentTime = 0;

        async function init() {
            try {
                document.getElementById("startBtn").innerHTML = "Loading...";
                
                // Pastikan URL diakhiri dengan /
                model = await tmImage.load(URL_MODEL + "model.json", URL_MODEL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                webcam = new tmImage.Webcam(400, 400, true); 
                await webcam.setup(); 
                await webcam.play();
                
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                
                document.getElementById("startBtn").innerHTML = "Camera Active ✅";
                document.getElementById("startBtn").style.backgroundColor = "#28a745";
            } catch (e) {
                console.error(e);
                alert("Ralat: Pastikan URL Model betul, Internet OK, dan Kamera dibenarkan.");
                document.getElementById("startBtn").innerHTML = "Retry Camera";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let best = { name: "", prob: 0 };

            for (let i = 0; i < maxPredictions; i++) {
                const pName = prediction[i].className;
                const pProb = prediction[i].probability;
                
                labelContainer.childNodes[i].innerHTML = pName + ": " + pProb.toFixed(2);
                
                if (pProb > best.prob) { 
                    best = { name: pName, prob: pProb }; 
                }
            }

            const ip = document.getElementById("espIp").value;
            // Cooldown 10 saat supaya ESP32 tak "hang"
            const isReady = (Date.now() - lastSentTime) > 10000; 

            if (best.prob > 0.90 && best.name !== "Class 1" && isReady) {
                lastSentTime = Date.now();
                sendData(ip, best.name);
            }
        }

        function sendData(ip, name) {
            console.log("Hantar data ke ESP32...");
            const finalUrl = `http://${ip}/update?name=${encodeURIComponent(name)}`;
            
            fetch(finalUrl, { mode: 'no-cors' }) // No-cors membantu elak error browser
                .then(() => console.log("ESP32 Notified: " + name))
                .catch(err => console.error("Gagal hubungi ESP32: " + err));
        }
    </script>
</body>
</html>
