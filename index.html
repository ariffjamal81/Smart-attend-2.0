<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Smart Attend Saujana 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #webcam-container { margin: 20px auto; border: 5px solid #333; width: max-content; }
        #label-container { font-size: 24px; font-weight: bold; margin-top: 10px; }
        .btn { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Smart Attend Saujana - Sistem Kehadiran AI</h2>
    
    <button class="btn" type="button" onclick="init()">MULAKAN KAMERA</button>

    <div id="webcam-container"></div>
    <div id="label-container">Menunggu kamera...</div>

    <script type="text/javascript">
        // 1. Masukkan URL model Teachable Machine anda di sini
        const URL_MODEL = "MASUKKAN_LINK_MODEL_ANDA_DI_SINI/"; 

        // 2. Masukkan URL Google Web App (Apps Script) anda di sini
        const SCRIPT_URL = "URL_WEB_APP_ANDA"; 

        let model, webcam, labelContainer, maxPredictions;
        let isProcessing = false;

        async function init() {
            const modelURL = URL_MODEL + "model.json";
            const metadataURL = URL_MODEL + "metadata.json";

            // Load model
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Setup webcam
            const flip = true; 
            webcam = new tmImage.Webcam(400, 400, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            
            for (let i = 0; i < maxPredictions; i++) {
                const name = prediction[i].className;
                const probability = prediction[i].probability.toFixed(2);

                if (probability > 0.90 && name !== "Class 2" && !isProcessing) { 
                    labelContainer.innerHTML = "Selamat Datang: " + name;
                    sendDataToSheets(name);
                }
            }
        }

        function sendDataToSheets(name) {
            isProcessing = true; // Elakkan data hantar berkali-kali serentak
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama: name, timestamp: new Date() })
            })
            .then(() => {
                console.log("Data berjaya dihantar untuk: " + name);
                setTimeout(() => { isProcessing = false; }, 5000); // Tunggu 5 saat sebelum boleh scan nama seterusnya
            })
            .catch((error) => {
                console.error('Error:', error);
                isProcessing = false;
            });
        }
    </script>
</body>
</html>
