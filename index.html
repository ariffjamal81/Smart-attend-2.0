<!DOCTYPE html>
<html>
<head>
    <title>Smart Attend 2.0 - Face Sync</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #webcam-container { margin: 20px auto; border: 5px solid #333; width: 400px; height: 400px; background: #eee; }
        .controls { background: #f4f4f4; padding: 15px; border-radius: 10px; display: inline-block; }
        #label-container { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>
    <h1>Smart Attend Saujana (Sync Mode)</h1>
    
    <div class="controls">
        <p>1. Masukkan IP ESP32 (dari Serial Monitor):</p>
        <input type="text" id="espIp" value="172.20.10.4" placeholder="Contoh: 172.20.10.4">
        <br><br>
        <button type="button" id="startBtn" onclick="init()">2. Start Camera</button>
    </div>

    <div id="webcam-container"></div>
    <div id="label-container"></div>

    <script type="text/javascript">
        // --- MASUKKAN URL MODEL ANDA DI SINI ---
        const URL = "MASUKKAN_URL_TEACHABLE_MACHINE_ANDA_DI_SINI/"; 

        let model, webcam, labelContainer, maxPredictions;
        let lastSentTime = 0;

        async function init() {
            try {
                document.getElementById("startBtn").innerHTML = "Loading Model...";
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                webcam = new tmImage.Webcam(400, 400, true);
                await webcam.setup();
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").innerHTML = "";
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                document.getElementById("startBtn").innerHTML = "Camera Active";
            } catch (err) {
                console.error(err);
                alert("Gagal mulakan kamera. Semak URL Model atau Permission.");
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let best = { name: "", prob: 0 };

            for (let i = 0; i < maxPredictions; i++) {
                const pName = prediction[i].className;
                const pProb = prediction[i].probability;
                labelContainer.childNodes[i].innerHTML = pName + ": " + pProb.toFixed(2);
                if (pProb > best.prob) { best = { name: pName, prob: pProb }; }
            }

            const ip = document.getElementById("espIp").value;
            const cooldown = (Date.now() - lastSentTime) > 10000;

            // SYNC: Jika dikesan > 90% dan bertenang 10 saat
            if (best.prob > 0.90 && best.name !== "Class 1" && cooldown) {
                lastSentTime = Date.now();
                sendToESP32(ip, best.name);
            }
        }

        function sendToESP32(ip, name) {
            console.log("Menghantar " + name + " ke ESP32...");
            // PEMBETULAN: Kurungan fetch sudah ditutup dengan betul
            fetch(http://${ip}/update?name=${encodeURIComponent(name)})
                .then(response => response.text())
                .then(data => {
                    console.log("ESP32 berkata: " + data);
                })
                .catch(err => {
                    console.error("Gagal hubungi ESP32: ", err);
                });
        }
    </script>
</body>
</html>
